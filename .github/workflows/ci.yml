name: CI

on:
  push:
    branches: [main, feat-reject-negatives]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install pytest
        run: pip install pytest

      - name: Run unit tests
        run: pytest
